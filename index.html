<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Deonats</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── DESIGN TOKENS ── */
:root{
  --bg:#000;--bg2:#0d0d0d;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;
  --border:rgba(255,255,255,.08);--fg:#fff;--fg2:rgba(255,255,255,.55);
  --fg3:rgba(255,255,255,.28);--abg:rgba(255,255,255,.09);
  --green:#30d158;--red:#ff453a;--gold:#ffd60a;--blue:#0a84ff;--purple:#bf5af2;
  --r:22px;--rsm:14px;--rxs:10px;
  --sh:0 8px 40px rgba(0,0,0,.55);
  --f:'DM Sans',-apple-system,sans-serif;--m:'DM Mono','SF Mono',monospace;
  --sp:cubic-bezier(.34,1.56,.64,1);--eo:cubic-bezier(.16,1,.3,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
body.light{
  --bg:#f2f2f7;--bg2:#e5e5ea;--card:#fff;--card2:#f2f2f7;--card3:#e5e5ea;
  --border:rgba(0,0,0,.07);--fg:#000;--fg2:rgba(0,0,0,.5);--fg3:rgba(0,0,0,.25);
  --abg:rgba(0,0,0,.06);--sh:0 8px 40px rgba(0,0,0,.1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:var(--f);color:var(--fg);overflow:hidden;transition:background .3s,color .3s}
#root{width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}

/* ── SCREENS ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  transition:transform .42s var(--eo),opacity .32s var(--eo);will-change:transform,opacity;z-index:1}
.screen.hidden{transform:translateY(30px);opacity:0;pointer-events:none;z-index:0}

/* ── AUTH ── */
#s-auth{background:var(--bg);align-items:center;justify-content:center;padding:40px 24px;gap:0}
.auth-logo{width:86px;height:86px;border-radius:26px;
  background:linear-gradient(135deg,#1e1e3a,#0d0d1e);
  border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.auth-letter{font-size:40px;font-weight:200;color:#fff}
.auth-title{font-size:26px;font-weight:600;letter-spacing:-.5px;margin-bottom:6px}
.auth-sub{font-size:15px;color:var(--fg2);margin-bottom:36px}
.auth-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:11px}
.auth-tabs{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin-bottom:4px}
.auth-tab{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;
  color:var(--fg2);font-family:var(--f);font-size:14px;font-weight:500;cursor:pointer;
  transition:all .3s var(--sp)}
.auth-tab.on{background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.2);transform:scale(1.02)}
.finp{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:var(--rxs);
  padding:15px 16px;color:var(--fg);font-family:var(--f);font-size:16px;outline:none;
  transition:border-color .2s;-webkit-appearance:none}
.finp:focus{border-color:var(--blue)}
.finp::placeholder{color:var(--fg3)}
.fsel{cursor:pointer}.fsel option{background:var(--card)}
.btn-p{width:100%;height:54px;border-radius:var(--rsm);border:none;background:var(--fg);
  color:var(--bg);font-family:var(--f);font-size:16px;font-weight:600;cursor:pointer;
  transition:transform .2s var(--sp),opacity .2s;margin-top:4px}
.btn-p:active{transform:scale(.97)}.btn-p:disabled{opacity:.4;cursor:default}
.auth-err{font-size:13px;color:var(--red);text-align:center;min-height:18px;
  animation:fadein .3s var(--eo)}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ── LOCK ── */
#s-lock{background:linear-gradient(160deg,#1a1a2e,#0d0d1a 50%,#0a0a14);
  align-items:center;padding-top:calc(70px + var(--st))}
.lk-time{font-size:72px;font-weight:200;letter-spacing:-2px;color:#fff;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lk-date{font-size:16px;color:rgba(255,255,255,.65);margin-bottom:40px}
.lk-greet{font-size:14px;color:rgba(255,255,255,.45);margin-bottom:4px}
.lk-name{font-size:20px;font-weight:500;color:#fff;margin-bottom:36px}
.lk-hint{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:22px;min-height:20px;transition:color .2s}
.lk-hint.err{color:var(--red)}
.pin-dots{display:flex;gap:18px;justify-content:center;margin-bottom:26px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.38);transition:all .18s var(--sp)}
.pin-dot.on{background:#fff;border-color:#fff;transform:scale(1.12)}
.pin-dot.err{background:var(--red);border-color:var(--red);animation:shake .38s var(--eo)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:272px}
.pk{height:70px;border-radius:50%;background:rgba(255,255,255,.11);border:none;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .14s var(--sp),background .1s;backdrop-filter:blur(20px)}
.pk:active{transform:scale(.87);background:rgba(255,255,255,.22)}
.pk-n{font-size:25px;font-weight:300;line-height:1}
.pk-s{font-size:8.5px;letter-spacing:1.5px;color:rgba(255,255,255,.45);text-transform:uppercase}
.pk.ghost{background:transparent;pointer-events:none}
.pk.del{background:transparent}.pk.del:active{background:rgba(255,255,255,.08)}
.lk-exit{font-size:13px;color:rgba(255,255,255,.3);margin-top:22px;cursor:pointer}

/* ── MAIN LAYOUT ── */
#s-main{background:var(--bg)}
.top-bar{padding:calc(12px + var(--st)) 20px 0;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;gap:8px}
.top-logo{font-size:17px;font-weight:600;letter-spacing:-.4px}
.top-r{display:flex;gap:5px;align-items:center}
.ibtn{height:32px;border-radius:100px;border:none;background:var(--abg);color:var(--fg);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;padding:0 11px;font-family:var(--f);
  transition:all .18s var(--eo);letter-spacing:.3px;white-space:nowrap}
.ibtn:active{transform:scale(.91);background:var(--card3)}
.ibtn.dim{color:var(--fg2)}

/* ── TAB BAR ── */
.tab-bar{display:flex;border-top:1px solid var(--border);background:var(--bg2);
  padding:8px 0 calc(8px + var(--sb));flex-shrink:0}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:transparent;color:var(--fg3);cursor:pointer;padding:6px 0;
  font-family:var(--f);font-size:10px;font-weight:500;letter-spacing:.3px;
  transition:color .2s;-webkit-appearance:none}
.tab-btn.on{color:var(--blue)}
.tab-ico{font-size:22px;line-height:1;transition:transform .25s var(--sp)}
.tab-btn.on .tab-ico{transform:scale(1.15)}
.tab-lbl{font-size:10px;font-weight:500}

/* ── PANELS ── */
.panel{display:none;flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 20px calc(16px);-webkit-overflow-scrolling:touch;
  flex-direction:column;gap:20px}
.panel::-webkit-scrollbar{display:none}
.panel.active{display:flex}

/* ── CURRENCY SWITCHER ── */
.cur-row{display:flex;gap:4px;background:var(--card);border-radius:100px;
  padding:3px;border:1px solid var(--border);align-self:flex-start}
.cur-btn{height:28px;padding:0 12px;border-radius:100px;border:none;background:transparent;
  color:var(--fg2);font-family:var(--f);font-size:12px;font-weight:500;cursor:pointer;
  transition:all .22s var(--sp)}
.cur-btn.on{background:var(--card2);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.18);transform:scale(1.04)}

/* ── CARD ── */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);
  box-shadow:var(--sh);overflow:hidden;animation:sup .42s var(--eo) both}
@keyframes sup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── BALANCE ── */
.bal-inner{padding:22px 22px 18px}
.bal-lbl{font-size:11px;font-weight:500;color:var(--fg2);letter-spacing:.7px;text-transform:uppercase;margin-bottom:7px}
.bal-num{font-size:clamp(32px,8.5vw,42px);font-weight:300;letter-spacing:-1.4px;line-height:1;
  margin-bottom:18px;display:flex;align-items:flex-start;gap:3px}
.bal-sym{font-size:20px;font-weight:400;opacity:.42;margin-top:5px}
.bal-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bst{background:var(--abg);border-radius:var(--rsm);padding:13px}
.bst-l{font-size:10px;color:var(--fg2);margin-bottom:4px;font-weight:500;letter-spacing:.5px}
.bst-v{font-size:17px;font-weight:500;letter-spacing:-.3px}
.clg{color:var(--green)}.clr{color:var(--red)}

/* ── SECTION HEADER ── */
.sec-h{display:flex;align-items:center;justify-content:space-between}
.sec-t{font-size:16px;font-weight:600;letter-spacing:-.3px}
.sec-a{font-size:14px;color:var(--blue);cursor:pointer;font-weight:500}

/* ── TX ITEM ── */
.tx-item{display:flex;align-items:center;gap:13px;padding:13px 18px;
  transition:background .14s;cursor:default}
.tx-item:active{background:var(--abg)}
.tx-ico{width:42px;height:42px;border-radius:13px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-d{font-size:12px;color:var(--fg2);margin-top:2px}
.tx-a{font-size:14px;font-weight:600;font-family:var(--m);flex-shrink:0}
.tx-sep{height:1px;background:var(--border);margin:0 18px}

/* ── GOALS ── */
.gc{padding:16px 18px;animation:sup .42s var(--eo) both}
.gc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.gc-ico-wrap{display:flex;align-items:center;gap:10px}
.gc-ico{width:34px;height:34px;border-radius:9px;background:var(--abg);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.gc-n{font-size:14px;font-weight:500}
.gc-dl{font-size:11px;color:var(--fg3);margin-top:2px}
.gc-r{text-align:right}
.gc-a{font-size:14px;font-weight:600}
.gc-tg{font-size:11px;color:var(--fg3);margin-top:2px}
.gc-add-btn{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;
  font-family:var(--f);font-weight:500;padding:2px 0;margin-top:4px;display:block;text-align:right}
.ptr{height:4px;background:var(--abg);border-radius:100px;overflow:hidden}
.pf{height:100%;border-radius:100px;transition:width .9s var(--eo)}
.pf.g{background:var(--green)}.pf.gold{background:var(--gold)}.pf.b{background:var(--blue)}.pf.r{background:var(--red)}.pf.p{background:var(--purple)}
.gc-ft{display:flex;justify-content:space-between;margin-top:7px}
.gc-pc{font-size:11px;color:var(--fg2);font-family:var(--m)}

/* ── TODOS ── */
.todo-item{display:flex;align-items:center;gap:12px;padding:13px 18px;transition:background .14s}
.todo-item:active{background:var(--abg)}
.todo-cb{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:all .2s var(--sp)}
.todo-cb.done{background:var(--green);border-color:var(--green)}
.todo-cb.done::after{content:'✓';font-size:12px;color:#000;font-weight:700}
.todo-info{flex:1;min-width:0}
.todo-t{font-size:14px;font-weight:500;transition:opacity .2s,text-decoration .2s}
.todo-t.done{opacity:.4;text-decoration:line-through}
.todo-due{font-size:11px;color:var(--fg3);margin-top:2px}
.todo-pri{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.todo-del{background:none;border:none;cursor:pointer;color:var(--fg3);font-size:16px;padding:4px;
  transition:color .15s}
.todo-del:active{color:var(--red)}
.pri-high{background:var(--red)}.pri-normal{background:var(--gold)}.pri-low{background:var(--green)}

/* ── EVENTS ── */
.ev-item{display:flex;gap:12px;padding:13px 18px;transition:background .14s}
.ev-item:active{background:var(--abg)}
.ev-line{width:4px;border-radius:100px;flex-shrink:0;align-self:stretch;min-height:40px}
.ev-body{flex:1;min-width:0}
.ev-t{font-size:14px;font-weight:500}
.ev-time{font-size:12px;color:var(--fg2);margin-top:3px;font-family:var(--m)}
.ev-loc{font-size:12px;color:var(--fg3);margin-top:2px}
.ev-cal{background:none;border:none;cursor:pointer;color:var(--blue);font-size:12px;
  font-family:var(--f);font-weight:500;padding:4px 0 0;display:block}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:36px 20px;color:var(--fg3);font-size:14px;line-height:1.7;
  white-space:pre-line}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(76px + var(--sb));right:24px;
  width:54px;height:54px;border-radius:50%;border:none;
  background:var(--blue);color:#fff;font-size:24px;font-weight:300;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(10,132,255,.4);
  transition:transform .22s var(--sp),box-shadow .22s;z-index:50}
.fab:active{transform:scale(.91);box-shadow:0 2px 10px rgba(10,132,255,.3)}

/* ── OVERLAY / SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);z-index:200;display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s var(--eo)}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--card);border-radius:26px 26px 0 0;
  padding:18px 20px calc(32px + var(--sb));width:100%;max-width:430px;
  transform:translateY(110%);transition:transform .42s var(--sp);
  max-height:90dvh;overflow-y:auto}
.sheet::-webkit-scrollbar{display:none}
.overlay.open .sheet{transform:translateY(0)}
.sh-handle{width:36px;height:4px;background:var(--card3);border-radius:100px;margin:0 auto 18px}
.sh-ttl{font-size:19px;font-weight:600;letter-spacing:-.4px;margin-bottom:18px}
.fg{margin-bottom:13px}
.flbl{font-size:11px;font-weight:500;color:var(--fg2);letter-spacing:.5px;
  margin-bottom:6px;display:block;text-transform:uppercase}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px;margin-bottom:13px}
.seg-btn{flex:1;padding:9px 6px;border-radius:8px;border:none;background:transparent;
  color:var(--fg2);font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;
  transition:all .28s var(--sp)}
.seg-btn.on{background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.18);transform:scale(1.02)}
.sbtn{width:100%;height:52px;border-radius:var(--rsm);border:none;background:var(--fg);
  color:var(--bg);font-family:var(--f);font-size:15px;font-weight:600;cursor:pointer;
  margin-top:6px;transition:transform .2s var(--sp),opacity .2s}
.sbtn:active{transform:scale(.97)}.sbtn:disabled{opacity:.4}

/* ── GOAL COLOR PICKER ── */
.col-row{display:flex;gap:8px;margin-bottom:13px}
.col-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;
  border:3px solid transparent;transition:transform .2s var(--sp)}
.col-dot.on{border-color:var(--fg);transform:scale(1.12)}

/* ── ICON PICKER ── */
.ico-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.ico-btn{font-size:21px;background:var(--card2);border:none;border-radius:9px;
  width:38px;height:38px;cursor:pointer;transition:background .15s,transform .15s var(--sp)}
.ico-btn:active{transform:scale(.9)}
.ico-btn.on{background:var(--card3);outline:2px solid var(--blue)}

/* ── TOAST ── */
.toast{position:fixed;top:calc(14px + var(--st));left:50%;
  transform:translateX(-50%) translateY(-90px);
  background:var(--card);color:var(--fg);padding:11px 20px;border-radius:100px;
  font-size:14px;font-weight:500;z-index:500;transition:transform .38s var(--sp);
  white-space:nowrap;border:1px solid var(--border);box-shadow:var(--sh)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── LOADING ── */
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
  border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:999;flex-direction:column;gap:14px}

/* ── STAGGER ── */
.s1{animation-delay:.04s}.s2{animation-delay:.09s}.s3{animation-delay:.14s}
.s4{animation-delay:.19s}.s5{animation-delay:.24s}.s6{animation-delay:.29s}
</style>
</head>
<body>
<div id="root">

  <!-- LOADING -->
  <div id="s-loading" class="loading-screen">
    <div style="font-size:32px;font-weight:200;color:var(--fg)">D</div>
    <div class="spin"></div>
  </div>

  <!-- AUTH -->
  <div class="screen hidden" id="s-auth">
    <div class="auth-logo"><span class="auth-letter">D</span></div>
    <div class="auth-title">Deonats</div>
    <div class="auth-sub">Личные финансы</div>
    <div class="auth-form">
      <div class="auth-tabs">
        <button class="auth-tab on" id="at-login">Войти</button>
        <button class="auth-tab" id="at-reg">Регистрация</button>
      </div>
      <!-- LOGIN -->
      <div id="form-login">
        <input class="finp" id="li-email" type="email" placeholder="Email" autocomplete="email" style="margin-bottom:11px"/>
        <input class="finp" id="li-pass" type="password" placeholder="Пароль" autocomplete="current-password"/>
        <div class="auth-err" id="li-err"></div>
        <button class="btn-p" id="li-btn">Войти</button>
      </div>
      <!-- REGISTER -->
      <div id="form-reg" style="display:none">
        <input class="finp" id="rg-name" type="text" placeholder="Ваше имя" autocapitalize="words" style="margin-bottom:11px"/>
        <input class="finp" id="rg-email" type="email" placeholder="Email" autocomplete="email" style="margin-bottom:11px"/>
        <input class="finp" id="rg-pass" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="new-password" style="margin-bottom:11px"/>
        <input class="finp" id="rg-pin" type="password" placeholder="ПИН-код (6 цифр)" inputmode="numeric" maxlength="6"/>
        <div class="auth-err" id="rg-err"></div>
        <button class="btn-p" id="rg-btn">Создать аккаунт</button>
      </div>
    </div>
  </div>

  <!-- LOCK -->
  <div class="screen hidden" id="s-lock">
    <div class="lk-time" id="lk-time">00:00</div>
    <div class="lk-date" id="lk-date"></div>
    <div class="lk-greet">Добро пожаловать,</div>
    <div class="lk-name" id="lk-name"></div>
    <div class="lk-hint" id="lk-hint">Введите ПИН-код</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="pin-grid" id="pin-grid"></div>
    <div class="lk-exit" id="lk-exit">Сменить аккаунт</div>
  </div>

  <!-- MAIN -->
  <div class="screen hidden" id="s-main">
    <div class="top-bar">
      <div class="top-logo">Deonats</div>
      <div class="top-r" id="top-r"></div>
    </div>

    <!-- PANELS -->
    <div id="p-finance" class="panel active"></div>
    <div id="p-goals"   class="panel"></div>
    <div id="p-todo"    class="panel"></div>
    <div id="p-events"  class="panel"></div>

    <!-- TAB BAR -->
    <nav class="tab-bar" id="tab-bar">
      <button class="tab-btn on" data-tab="finance"><span class="tab-ico">💳</span><span class="tab-lbl">Финансы</span></button>

const $ = id => document.getElementById(id);
function ce(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls)  e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function t(k)  { return I18[S.lang][k] || k; }
function sym() { return CUR[S.cur].s; }
function fmtKzt(kzt) {
  const v = kzt * CUR[S.cur].r, a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return Math.round(v).toLocaleString('ru-RU');
  if (a < 1 && a > 0) return v.toFixed(2);
  return Math.round(v).toLocaleString('ru-RU');
}
function toast(msg, dur = 2200) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), dur);
}
function showErr(id, msg) { $(id).textContent = msg; }

// Screen transitions

// DATABASE LAYER  (все функции async/await, единый клиент db)

async function fetchProfile(uid) {
  const { data, error } = await db
    .from('profiles')
    .select('*')
    .eq('id', uid)
    .single();
  if (error) throw error;
  return data;
}

async function createProfile(uid, displayName, pinRaw) {
  // Простой хэш пина (в реальных приложениях используй bcrypt на сервере)
  const pinHash = btoa(pinRaw + uid.slice(0, 8));
  const { error } = await db.from('profiles').insert({
    id: uid, display_name: displayName, pin_hash: pinHash
  });
  if (error) throw error;
}

async function updateProfileSettings(uid, patch) {
  const { error } = await db.from('profiles').update(patch).eq('id', uid);
  if (error) throw error;
}

async function fetchTransactions(uid) {
  const { data, error } = await db
    .from('transactions')
    .select('*')
    .eq('uid', uid)
    .order('tx_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(100);
  if (error) throw error;
  return data || [];
}

async function insertTransaction(uid, payload) {
  const { data, error } = await db
    .from('transactions')
    .insert({ uid, ...payload })
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function deleteTransaction(id) {
  const { error } = await db.from('transactions').delete().eq('id', id);
  if (error) throw error;
}

async function fetchGoals(uid) {
  const { data, error } = await db
    .from('goals')
    .select('*')
    .eq('uid', uid)
    .order('created_at', { ascending: true });
  if (error) throw error;
  return data || [];
}

async function insertGoal(uid, payload) {
  const { data, error } = await db
    .from('goals')
    .insert({ uid, ...payload })
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function updateGoalCurrent(id, newCurrent) {
  const { error } = await db
    .from('goals')
    .update({ current: newCurrent })
    .eq('id', id);
  if (error) throw error;
}

async function fetchTodos(uid) {
  const { data, error } = await db
    .from('todos')
    .select('*')
    .eq('uid', uid)
    .order('done', { ascending: true })
    .order('created_at', { ascending: false });
  if (error) throw error;
  return data || [];
}

async function insertTodo(uid, payload) {
  const { data, error } = await db
    .from('todos')
    .insert({ uid, ...payload })
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function toggleTodoDone(id, done) {
  const { error } = await db.from('todos').update({ done }).eq('id', id);
  if (error) throw error;
}

async function deleteTodo(id) {
  const { error } = await db.from('todos').delete().eq('id', id);
  if (error) throw error;
}

async function fetchEvents(uid) {
  const { data, error } = await db
    .from('events')
    .select('*')
    .eq('uid', uid)
    .gte('starts_at', new Date().toISOString())
    .order('starts_at', { ascending: true })
    .limit(50);
  if (error) throw error;
  return data || [];
}

async function insertEvent(uid, payload) {
  const { data, error } = await db
    .from('events')
    .insert({ uid, ...payload })
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function deleteEvent(id) {
  const { error } = await db.from('events').delete().eq('id', id);
  if (error) throw error;
}

// ════════════════════════════════════════════════════════════
// AUTH SCREEN
// ════════════════════════════════════════════════════════════
let authMode = 'login';

function initAuthScreen() {
  $('at-login').addEventListener('click', () => setAuthMode('login'));
  $('at-reg').addEventListener('click',   () => setAuthMode('reg'));
  $('li-btn').addEventListener('click',   handleLogin);
  $('rg-btn').addEventListener('click',   handleRegister);
  [$('li-email'),$('li-pass')].forEach(inp =>
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); })
  );
  [$('rg-name'),$('rg-email'),$('rg-pass'),$('rg-pin')].forEach(inp =>
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); })
  );
}

function setAuthMode(mode) {
  authMode = mode;
  $('form-login').style.display = mode === 'login' ? 'flex' : 'none';
  $('form-reg').style.display   = mode === 'reg'   ? 'flex' : 'none';
  $('at-login').classList.toggle('on', mode === 'login');
  $('at-reg').classList.toggle('on',   mode === 'reg');
  $('form-login').style.flexDirection = 'column';
  $('form-login').style.gap = '11px';
  $('form-reg').style.flexDirection = 'column';
  $('form-reg').style.gap = '11px';
}

async function handleLogin() {
  clearErr('li-err');
  const email = $('li-email').value.trim();
  const pass  = $('li-pass').value.trim();
  if (!email || !pass) { showErr('li-err', 'Заполните все поля'); return; }
  const btn = $('li-btn');
  btn.disabled = true; btn.textContent = '...';
  const { error } = await db.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Войти';
  if (error) showErr('li-err', error.message);
}

async function handleRegister() {
  clearErr('rg-err');
  const name  = $('rg-name').value.trim();
  const email = $('rg-email').value.trim();
  const pass  = $('rg-pass').value.trim();
  const pin   = $('rg-pin').value.trim();
  if (!name || !email || !pass || !pin) { showErr('rg-err', 'Заполните все поля'); return; }
  if (!/^\d{6}$/.test(pin))  { showErr('rg-err', 'ПИН: ровно 6 цифр'); return; }
  if (pass.length < 6)       { showErr('rg-err', 'Пароль мин. 6 символов'); return; }
  const btn = $('rg-btn');
  btn.disabled = true; btn.textContent = '...';
  const { data, error } = await db.auth.signUp({ email, password: pass });
  if (error) { showErr('rg-err', error.message); btn.disabled = false; btn.textContent = 'Создать аккаунт'; return; }
  if (data.user) {
    try { await createProfile(data.user.id, name, pin); }
    catch (e) { showErr('rg-err', e.message); btn.disabled = false; btn.textContent = 'Создать аккаунт'; return; }
  }
  btn.disabled = false; btn.textContent = 'Создать аккаунт';
  toast('Аккаунт создан! Проверьте email для подтверждения.');
  setAuthMode('login');
}

// ════════════════════════════════════════════════════════════
// LOCK SCREEN (PIN)
// ════════════════════════════════════════════════════════════
function buildLockScreen() {
  const dw = $('pin-dots'); dw.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const d = ce('div', 'pin-dot'); d.id = 'pd' + i; dw.appendChild(d);
  }
  const gw = $('pin-grid'); gw.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
    const b = ce('button', 'pk' + (k === '' ? ' ghost' : k === '⌫' ? ' del' : ''));
    if (k === '⌫') {
      b.innerHTML = '<svg width="20" height="14" viewBox="0 0 22 16" fill="none"><path d="M8 1L1 8L8 15" stroke="white" stroke-width="1.8" stroke-linecap="round"/><path d="M21 2H9L4 8L9 14H21V2Z" stroke="white" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M14 5L18 11M18 5L14 11" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>';
      b.addEventListener('click', pinDel);
    } else if (k !== '') {
      b.innerHTML = `<span class="pk-n">${k}</span>${PIN_SUBS[k] ? `<span class="pk-s">${PIN_SUBS[k]}</span>` : ''}`;
      b.addEventListener('click', () => pinTap(k));
    }
    gw.appendChild(b);
  });
  $('lk-exit').addEventListener('click', async () => {
    await db.auth.signOut();
    S.user = null; S.profile = null; S.pinBuf = '';
    showScreen('s-auth');
  });
}

function startClock() {
  function tick() {
    const n = new Date();
    $('lk-time').textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    $('lk-date').textContent = days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()];
  }
  tick();
  clearInterval(window._clk);
  window._clk = setInterval(tick, 15000);
}

function updatePinDots() {
  for (let i = 0; i < 6; i++) {
    const d = $('pd' + i);
    d.classList.toggle('on', i < S.pinBuf.length);
    d.classList.remove('err');
  }
}

function pinTap(digit) {
  if (S.pinBuf.length >= 6) return;
  S.pinBuf += digit;
  updatePinDots();
  if (S.pinBuf.length === 6) setTimeout(verifyPin, 80);
}

function pinDel() {
  if (S.pinBuf.length > 0) { S.pinBuf = S.pinBuf.slice(0, -1); updatePinDots(); }
}

function verifyPin() {
  if (!S.profile) return;
  
  // Проверяем хэш
  const pinHash = btoa(S.pinBuf + S.user.id.slice(0, 8));
  if (pinHash === S.profile.pin_hash) {
    S.pinBuf = '';
    loadAllData();
  } else {
    for (let i = 0; i < 6; i++) $('pd' + i).classList.add('err');
    const h = $('lk-hint'); h.textContent = t('pinErr'); h.classList.add('err');
    setTimeout(() => { S.pinBuf = ''; updatePinDots(); h.textContent = t('pinHint'); h.classList.remove('err'); }, 700);
  }
}

// ════════════════════════════════════════════════════════════
// LOAD ALL DATA → render main
// ════════════════════════════════════════════════════════════
async function loadAllData() {
  showScreen('s-main');
  $('fab').classList.remove('hidden');
  const uid = S.user.id;
  try {
    const [tx, goals, todos, events] = await Promise.all([
      fetchTransactions(uid),
      fetchGoals(uid),
      fetchTodos(uid),
      fetchEvents(uid)
    ]);
    S.data = { tx, goals, todos, events };
  } catch (e) { toast('Ошибка загрузки: ' + e.message); }
  // Apply saved settings
  if (S.profile) {
    S.lang  = S.profile.lang     || 'ru';
    S.theme = S.profile.theme    || 'dark';
    S.cur   = S.profile.currency || 'KZT';
    document.body.className = S.theme === 'light' ? 'light' : '';
  }
  renderTopBar();
  renderCurrentTab();
}

// ════════════════════════════════════════════════════════════
// TOP BAR
// ════════════════════════════════════════════════════════════
function renderTopBar() {
  const r = $('top-r'); r.innerHTML = '';

  ['ru','en'].forEach(l => {
    const b = ce('button', 'ibtn' + (S.lang === l ? '' : ' dim'), l.toUpperCase());
    b.addEventListener('click', async () => {
      S.lang = l;
      await updateProfileSettings(S.user.id, { lang: l });
      renderTopBar(); renderCurrentTab();
    });
    r.appendChild(b);
  });

  const cur = ce('button', 'ibtn', sym() + ' ' + S.cur);
  cur.addEventListener('click', () => { buildCurSheet(); openSheet('ov-top'); });
  r.appendChild(cur);

  const th = ce('button', 'ibtn', S.theme === 'dark' ? '☀️' : '🌙');
  th.style.cssText = 'padding:0;width:32px';
  th.addEventListener('click', async () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.body.className = S.theme === 'light' ? 'light' : '';
    await updateProfileSettings(S.user.id, { theme: S.theme });
    renderTopBar();
  });
  r.appendChild(th);

  const lo = ce('button', 'ibtn dim', t('logout'));
  lo.addEventListener('click', async () => {
    await db.auth.signOut();
    S.user = null; S.profile = null;
    $('fab').classList.add('hidden');
    showScreen('s-auth');
  });
  r.appendChild(lo);
}

function buildCurSheet() {
  const sh = $('sh-top'); sh.innerHTML = '';
  sh.appendChild(ce('div','sh-handle'));
  sh.appendChild(ce('div','sh-ttl','Валюта'));
  const row = ce('div','seg');
  Object.keys(CUR).forEach(k => {
    const b = ce('button','seg-btn'+(S.cur===k?' on':''), CUR[k].s + ' ' + k);
    b.addEventListener('click', async () => {
      S.cur = k;
      await updateProfileSettings(S.user.id, { currency: k });
      closeSheet('ov-top'); renderTopBar(); renderCurrentTab();
    });
    row.appendChild(b);
  });
  sh.appendChild(row);
}

// ════════════════════════════════════════════════════════════
// TAB ROUTING
// ════════════════════════════════════════════════════════════
function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      $('p-' + tab).classList.add('active');
      S.tab = tab;
      renderCurrentTab();
    });
  });
}

function renderCurrentTab() {
  switch (S.tab) {
    case 'finance': renderFinance(); break;
    case 'goals':   renderGoals();   break;
    case 'todo':    renderTodo();    break;
    case 'events':  renderEvents();  break;
  }
  // FAB action
  const fabActions = {
    finance: () => { buildTxSheet(); openSheet('ov-tx'); },
    goals:   () => { buildGoalSheet(); openSheet('ov-goal'); },
    todo:    () => { buildTodoSheet(); openSheet('ov-todo'); },
    events:  () => { buildEventSheet(); openSheet('ov-event'); }
  };
  $('fab').onclick = fabActions[S.tab];
}

// FINANCE PANEL
// ════════════════════════════════════════════════════════════
function renderFinance() {
  const p = $('p-finance'); p.innerHTML = '';
  const txs = S.data.tx;
  const inc = txs.filter(x => x.amount > 0).reduce((a,x) => a + Number(x.amount), 0);
  const exp = txs.filter(x => x.amount < 0).reduce((a,x) => a + Math.abs(Number(x.amount)), 0);
  const bal = inc - exp;

  // Balance card
  const bc = ce('div','card s1');
  bc.innerHTML = `<div class="bal-inner">

async function submitTx() {
  const rawAmt = parseFloat(($('tx-amt').value||'0').replace(',','.'));
  if (isNaN(rawAmt) || rawAmt <= 0) return;
  const kztAmt = rawAmt / CUR[S.cur].r;
  const cats   = CATS[S.lang];
  const cat    = cats.find(c => c.id === (($('tx-cat') && $('tx-cat').value) || S.txCat)) || cats[0];
  const name   = ($('tx-desc') && $('tx-desc').value.trim()) || cat.l;
  const txDate = ($('tx-date') && $('tx-date').value) || new Date().toISOString().split('T')[0];
  const amount = S.txType === 'income' ? kztAmt : -kztAmt;
  const sub = document.querySelector('#sh-tx .sbtn');
  if (sub) { sub.disabled = true; sub.textContent = '...'; }
  try {
    const row = await insertTransaction(S.user.id, {
      name, amount, category: cat.id, icon: cat.i, tx_date: txDate
    });
    S.data.tx.unshift(row);
    closeSheet('ov-tx');
    toast(t('saved'));
    renderFinance();
  } catch(e) {
    toast('Ошибка: ' + e.message);
  } finally {
    if (sub) { sub.disabled = false; sub.textContent = t('add'); }
  }
}

function buildTopupSheet(id, current, target, name) {
  const sh = $('sh-top'); sh.innerHTML = '';
  sh.appendChild(ce('div','sh-handle'));
  sh.appendChild(ce('div','sh-ttl', '+ ' + t('topup') + ': ' + name));

  const amtG = ce('div','fg');
  amtG.innerHTML = `<label class="flbl">${t('amt')} (${sym()})</label>`;
  const amtI = ce('input','finp'); amtI.type='number'; amtI.inputMode='decimal'; amtI.placeholder='0'; amtI.id='top-amt';
  amtG.appendChild(amtI); sh.appendChild(amtG);

  const sub = ce('button','sbtn', t('topup'));
  sub.addEventListener('click', async () => {
    const add = parseFloat(($('top-amt').value||'0').replace(',','.'));
    if (isNaN(add) || add <= 0) return;
    const addKzt   = add / CUR[S.cur].r;
    const newCur   = Math.min(current + addKzt, target);
    sub.disabled = true; sub.textContent = '...';
    try {
      await updateGoalCurrent(id, newCur);
      const g = S.data.goals.find(x => x.id === id);
      if (g) g.current = newCur;
      closeSheet('ov-top');
      toast(t('saved'));
      renderGoals();
    } catch(e) { toast('Ошибка: ' + e.message); }
    finally    { sub.disabled = false; sub.textContent = t('topup'); }
  });
  sh.appendChild(sub);
}

// ════════════════════════════════════════════════════════════
// ADD EVENT TO CALENDAR
// ════════════════════════════════════════════════════════════
function addEventToCalendar(ev) {
  const toGcalDate = iso => iso ? iso.replace(/[-:]/g,'').replace('.000','').split('+')[0].replace('T','T') : '';

  const start = new Date(ev.starts_at);
  const end   = ev.ends_at ? new Date(ev.ends_at) : new Date(start.getTime() + 60*60*1000);

  // Google Calendar
  const gcParams = new URLSearchParams({
    action: 'TEMPLATE',
    text:   ev.title,
    dates:  toGcalDate(start.toISOString()) + '/' + toGcalDate(end.toISOString()),
    details: ev.description || '',
    location: ev.location || ''
  });
  const gcUrl = 'https://calendar.google.com/calendar/render?' + gcParams.toString();

  // iCal / Apple Calendar (webcal)
  const ical = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Deonats//EN',
    'BEGIN:VEVENT',
    'DTSTART:' + toGcalDate(start.toISOString()),
    'DTEND:'   + toGcalDate(end.toISOString()),
    'SUMMARY:' + ev.title,
    ev.description ? 'DESCRIPTION:' + ev.description : '',
    ev.location    ? 'LOCATION:'    + ev.location    : '',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');

  const icalBlob = new Blob([ical], { type: 'text/calendar;charset=utf-8' });
  const icalUrl  = URL.createObjectURL(icalBlob);

  // Sheet with choices
  const sh = $('sh-top'); sh.innerHTML = '';
  sh.appendChild(ce('div','sh-handle'));
  sh.appendChild(ce('div','sh-ttl','Добавить в календарь'));

  const gcBtn = ce('button','btn-p', '📅 Google Calendar');
  gcBtn.style.marginBottom = '10px';
  gcBtn.addEventListener('click', () => { window.open(gcUrl,'_blank'); closeSheet('ov-top'); });

  const icBtn = ce('button','btn-p', '🍎 Apple / iCal (.ics)');
  icBtn.style.background  = 'var(--card2)';
  icBtn.style.color       = 'var(--fg)';
  icBtn.addEventListener('click', () => {
    const a = document.createElement('a'); a.href=icalUrl; a.download=ev.title+'.ics'; a.click();
    setTimeout(()=>URL.revokeObjectURL(icalUrl), 3000);
    closeSheet('ov-top');
  });

  sh.append(gcBtn, icBtn);
  openSheet('ov-top');
}

  const start = $('ev-start') && $('ev-start').value;
  if (!title || !start) return;
  const selCol = document.querySelector('#sh-event .col-dot.on');
  const sub = document.querySelector('#sh-event .sbtn');
  if (sub) { sub.disabled=true; sub.textContent='...'; }
  try {
    const row = await insertEvent(S.user.id, {
      title,
      starts_at:   new Date(start).toISOString(),
      ends_at:     $('ev-end').value ? new Date($('ev-end').value).toISOString() : null,
      location:    $('ev-loc').value.trim() || null,
      description: $('ev-desc').value.trim() || null,
      color:       selCol ? selCol.dataset.c : '#0a84ff'
    });
    S.data.events.push(row);
    S.data.events.sort((a,b) => new Date(a.starts_at) - new Date(b.starts_at));
    closeSheet('ov-event');
    toast(t('saved'));
    renderEvents();
  } catch(e) { toast('Ошибка: ' + e.message); }
  finally    { if(sub){sub.disabled=false;sub.textContent=t('add');} }
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + (dateStr.includes('T') ? '' : 'T00:00:00'));
  return d.toLocaleDateString(S.lang === 'ru' ? 'ru-RU' : 'en-US', {day:'numeric',month:'short'});
}

// ════════════════════════════════════════════════════════════
// BOOTSTRAP
// ════════════════════════════════════════════════════════════
async function init() {
  buildLockScreen();
  initAuthScreen();
  initTabs();

  // Auth state listener — единая точка входа
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      S.user = session.user;
      try {
        S.profile = await fetchProfile(S.user.id);
      } catch(e) {
        // Профиль ещё не создан (новый пользователь до подтверждения email)
        S.profile = null;
      }
      $('s-loading').style.display = 'none';
      // Показать lock если профиль есть
      if (S.profile && S.profile.pin_hash) {
        $('lk-name').textContent = S.profile.display_name || '';
        startClock();
        showScreen('s-lock');
      } else {
        await loadAllData();
      }
    } else if (event === 'SIGNED_OUT' || (!session)) {
      S.user = null; S.profile = null;
      $('s-loading').style.display = 'none';
      showScreen('s-auth');
    }
  });

  // Initial check
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    $('s-loading').style.display = 'none';
    showScreen('s-auth');
  }
}

init();
</script>
